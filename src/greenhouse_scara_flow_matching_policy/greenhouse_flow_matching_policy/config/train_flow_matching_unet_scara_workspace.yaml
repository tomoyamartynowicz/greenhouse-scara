defaults:
- _self_
- task: scara_image
name: greenhouse_fm
_target_: greenhouse_flow_matching_policy.workspace.train_flow_matching_unet_scara_workspace.TrainFlowMatchingUnetScaraWorkspace
task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: rectified_flow
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true
run_name: greenhouse_fm_h${horizon}_a${n_action_steps}_bs${dataloader.batch_size}_seed${training.seed}
output_dir: ${oc.env:GREENHOUSE_FM_RUN_ROOT,${oc.env:HOME}/greenhouse_runs/flow_matching_policy}/${run_name}
task:
  dataset_path: ${oc.env:GREENHOUSE_DATASET_DIR}
policy:
  _target_: greenhouse_flow_matching_policy.policy.flow_matching_unet_image_policy.FlowMatchingUnetImagePolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: greenhouse_scara_common.vision.MultiModalObsEncoder
    shape_meta: ${shape_meta}
    pretrained: false
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 16
  integration_method: heun
  time_scale: 100.0
  noise_scheduler: null
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims:
  - 256
  - 512
  - 1024
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
ema:
  _target_: greenhouse_flow_matching_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 20
  gradient_accumulate_every: 1
  use_ema: true
  freeze_encoder: false
  rollout_every: 5
  checkpoint_every: 1
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: greenhouse_scara_flow_matching_policy
  mode: ${oc.env:WANDB_MODE,offline}
  name: ${run_name}
  id: ${run_name}
  resume: false
checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 0
    format_str: epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
multi_run:
  run_dir: ${output_dir}
  wandb_name_base: ${run_name}
hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
    subdir: ${hydra.job.num}
