# Full-size current model; short training only, suitable for latency experiments.
defaults:
  - train_flow_matching_unet_scara_workspace
  - override task: scara_rgb_dual
  - _self_

training:
  device: cuda:0
  num_epochs: 1
  max_train_steps: 1
  max_val_steps: 1
  use_ema: false
  resume: false
dataloader:
  batch_size: 1
  num_workers: 0
  persistent_workers: false
val_dataloader:
  batch_size: 1
  num_workers: 0
  persistent_workers: false
task:
  env_runner:
    n_test_samples: 1
    batch_size: 1
logging:
  mode: disabled
