_target_: greenhouse_diffusion_policy.workspace.train_diffusion_unet_scara_workspace.TrainDiffusionUnetScaraWorkspace
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    k: 0
    monitor_key: train_loss
    mode: min
    format_str: epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
dataset_obs_steps: ${n_obs_steps}
ema:
  _target_: greenhouse_diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: ${run_name}
  mode: ${oc.env:WANDB_MODE,offline}
  name: ${run_name}
  project: greenhouse_scara_diffusion_policy
  resume: false
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: greenhouse_dp
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
output_dir: ${oc.env:GREENHOUSE_DP_RUN_ROOT,${oc.env:HOME}/greenhouse_runs/diffusion_policy}/${run_name}
past_action_visible: false
policy:
  _target_: greenhouse_diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  cond_predict_scale: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 256
  - 512
  - 1024
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    set_alpha_to_one: true
    steps_offset: 0
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  obs_encoder:
    _target_: greenhouse_scara_common.vision.MultiModalObsEncoder
    shape_meta: ${shape_meta}
    pretrained: false
  shape_meta: ${shape_meta}
run_name: greenhouse_dp_h${horizon}_a${n_action_steps}_bs${dataloader.batch_size}_seed${training.seed}
shape_meta: ${task.shape_meta}
task:
  dataset_path: ${oc.env:GREENHOUSE_DATASET_DIR}
task_name: ${task.name}
training:
  checkpoint_every: 1
  debug: false
  device: cuda:0
  freeze_encoder: false
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 20
  resume: false
  rollout_every: 5
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
defaults:
- _self_
- task: scara_image
hydra:
  run:
    dir: ${output_dir}
