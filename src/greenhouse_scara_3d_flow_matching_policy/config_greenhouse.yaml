dataset_dir: ${oc.env:GREENHOUSE_DATASET_DIR,../datasets/green_house_dataset1_from11}
calibration_file: calibration/greenhouse_top_approximate.yaml
action_source: auto
action_offset: 1
allow_single_episode: false
seed: 0
val_ratio: 0.2
horizon: 16
n_obs_steps: 2
n_action_steps: 8
batch_size: 64
val_batch_size: 64
num_workers: 4
epochs: 100000
device: cuda:0
learning_rate: 0.0001
weight_decay: 1.0e-06
optimizer_betas:
- 0.95
- 0.999
warmup_steps: 500
use_ema: true
grad_clip: 1.0
resume: false
max_train_steps: null
max_val_steps: null
pointcloud:
  cameras:
  - camera_top
  reference_frame: camera_top
  num_points: 1024
  use_color: true
  normalization: limits
  min_depth_m: 0.02
  max_depth_m: 1.0
  pixel_stride: 2
  fps_candidates: 4096
  crop_min: null
  crop_max: null
model: flow3d
output_dir: runs/3d/fm3
policy:
  encoder_output_dim: 64
  num_inference_steps: 8
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  kernel_size: 5
  n_groups: 8
  condition_type: film
  integration_method: heun
  time_scale: 100.0
pointcloud_cache_dir: ${oc.env:GREENHOUSE_3D_CACHE_DIR,../datasets/green_house_dataset1_pointcloud_top}
include_scissor_roll: true
lr_scheduler: constant_with_warmup
checkpoint_every: 10
keep_checkpoints: 5
